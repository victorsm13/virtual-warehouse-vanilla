<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Almoxarifado</title>
    <link rel="stylesheet" href="./styles/shared.css">
    <link rel="stylesheet" href="./styles/graficoPage.css">
</head>
<body>

    <header id="header">

        <a class="title" href="./homePage.html"><h1>warehouse</h1></a>
       
        <input type="checkbox" id="check">
        <label for="check" class="icons">
            <img src="./assets/menu-closer.svg" alt="menu-icon" id="menuIcon">
            <img src="./assets/x.svg" alt="close-icon" id="xIcon">
        </label>

        <div class="header-links">
            <a href="./estoquePage.html">Stock</a>
            <a href="./historicoPage.html">History</a>
            <a href="./graficoPage.html">Charts</a>
        </div>
    </header>

    <main id="mainGraficoPage">
        <h2>Charts</h2>

        <div class="filtroBox">
            <div class="dataBox">
                <div class="dataContainer">
                    <span>Start date:</span>
                    <input class="jsDataInicial dataInicial" type="date">
                </div>
                <div class="dataContainer">
                    <span>End date:</span>
                    <input class="jsDataFinal dataFinal" type="date">
                </div>
            </div>
            <div class="produtoBox">
                <label for="produto">Product:</label>
                <select class="jsProduto" name="produto" id="produto">

                </select>
            </div>
            <div class="tipoMovimentação">
                <label for="tipoMovimentacao">Type of Movement:</label>
                <select class="jsTipoMovimentacao" name="tipoMovimentacao" id="tipoMovimentacao">
                    <option value="Entrada">Entry</option>
                    <option value="Saída">Exit</option>
                </select>
            </div>

        </div>

        <div class="buttonsBox">
            <button class='jsButtonGrafico' id="gerarGráfico">Generate Chart</button>
        </div>

        <div class="graficoBox">
            <canvas class="grafico" id="grafico"></canvas>
        </div>
        
    </main>
    
    <script type="module" src="./script/graficoPage.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</body>
</html>
