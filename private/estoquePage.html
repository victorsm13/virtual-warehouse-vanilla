<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Almoxarifado</title>
    <link rel="stylesheet" href="../public/styles/shared.css">
    <link rel="stylesheet" href="../public/styles/estoquePage.css">
</head>
<body>

     <div class="jsMessageBoxTwo messageBoxTwo hiden">
        <div class="jsMessageContainerTwo messageContainerTwo">
            <span class="jsMessageTwo messageTwo">
                Produto adicionado com sucesso!
            </span>
        </div>
    </div>

    <div class="jsMessageBox messageBox hiden">
        <div class="messageContainer">
            <img class="jsCloseError" id="closeError" src="../public/assets/x.svg" alt="">
            <span class="jsMessage message"></span>
            <div class="jsMessageButtons messageButtons">
                <button class="jsConfirmarBtt" id="simBtt">sim</button>
                <button class="jsNegarBtt" id="naoBtt">não</button>
            </div>
        </div>
    </div>

    <header id="header">
        
        <a class="title" href="./homePage.html"><h1>Almoxarifado</h1></a>

        <input type="checkbox" id="check">
        <label for="check" class="icons">
            <img src="../public/assets/menu-closer.svg" alt="menu-icon" id="menuIcon">
            <img src="../public/assets/x.svg" alt="close-icon" id="xIcon">
        </label>

        <div class="header-links">
            <a href="./estoquePage.html">estoque</a>
            <a href="./historicoPage.html">histórico</a>
            <a href="./graficoPage.html">Gráficos</a>
        </div>
    </header>

    <main id="mainEstoquePage">

        <div class="main-header">
         <div class="search-container js-search-container">
            <div class="search-box">
                <input class="search-input js-search-input" type="text" placeholder="Pesquise aqui...">
                <img class="search-icon icon js-search-icon" src="../public/assets/search-icon.svg" alt="search-icon">
            </div>
            <div class="filter-box js-filter-box">
                <input type="checkbox" id="check-filter">
                <label for="check-filter" class="filtrarMain">
                    <span>Filtrar</span>
                    <img class="filter-icon icon" src="../public/assets/filter-icon.svg" alt="filter-icon">
                </label>
            </div> 
            <div class="filtar-categoria js-filtrar-categoria hiden">
                <label for="">Categoria</label>
               <select class="jsCategoria" name="cateforia" id="categoria">
                    <option value="escritorio">Materias de escritório</option>
                    <option value="TI">Equipamentos de TI</option>
                    <option value="eletrico">Materias elétricos</option>
                    <option value="Limpeza">Limpeza e manutenção</option>
                    <option value="producao">Materias de produção</option>
                    <option value="geral">Geral</option>
               </select>
               <button class="jsFiltrarBtn" id="filtrarBtn">Filtrar</button>
            </div> 
        </div>
        </div>

        <div class="jsProdutosContainer produtos-container-grid">

           
        </div>
    </main>
    
    <script type="module" src="./script/estoquePage.js"></script>
</body>
</html>
