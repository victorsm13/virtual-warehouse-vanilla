<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Almoxarifado</title>
    <link rel="stylesheet" href="../public/styles/shared.css">
    <link rel="stylesheet" href="../public/styles/graficoPage.css">
</head>
<body>

    <header id="header">

        <a class="title" href="./homePage.html"><h1>Almoxarifado</h1></a>
       
        <input type="checkbox" id="check">
        <label for="check" class="icons">
            <img src="../public/assets/menu-closer.svg" alt="menu-icon" id="menuIcon">
            <img src="../public/assets/x.svg" alt="close-icon" id="xIcon">
        </label>

        <div class="header-links">
            <a href="./estoquePage.html">estoque</a>
            <a href="./historicoPage.html">histórico</a>
            <a href="./graficoPage.html">Gráficos</a>
        </div>
    </header>

    <main id="mainGraficoPage">
        <h2>Gráfico</h2>

        <div class="filtroBox">
            <div class="dataBox">
                <div class="dataContainer">
                    <span>Data inicial:</span>
                    <input class="jsDataInicial dataInicial" type="date">
                </div>
                <div class="dataContainer">
                    <span>Data final:</span>
                    <input class="jsDataFinal dataFinal" type="date">
                </div>
            </div>
            <div class="produtoBox">
                <label for="produto">Produto:</label>
                <select class="jsProduto" name="produto" id="produto">

                </select>
            </div>
            <div class="tipoMovimentação">
                <label for="tipoMovimentacao">Tipo de Movimentação:</label>
                <select class="jsTipoMovimentacao" name="tipoMovimentacao" id="tipoMovimentacao">
                    <option value="entrada">Entrada</option>
                    <option value="saida">Saída</option>
                </select>
            </div>

        </div>

        <div class="buttonsBox">
            <button class='jsButtonGrafico' id="gerarGráfico">Gerar Gráfico</button>
        </div>

        <div class="graficoBox">
            <canvas class="grafico" id="grafico"></canvas>
        </div>
        
    </main>
    
    <script type="module" src="./script/graficoPage.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</body>
</html>
