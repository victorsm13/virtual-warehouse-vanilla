<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Almoxarifado</title>
    <link rel="stylesheet" href="./styles/shared.css">
    <link rel="stylesheet" href="./styles/homePage.css">
</head>
<body>

    <header id="header">
        <h1>Almoxarifado</h1>

        <input type="checkbox" id="check">
        <label for="check" class="icons">
            <img src="./assets/menu-closer.svg" alt="menu-icon" id="menuIcon">
            <img src="./assets/x.svg" alt="close-icon" id="xIcon">
        </label>

        <div class="header-links">
            <a href="#">estoque</a>
            <a href="#">histórico</a>
            <a href="">Gráficos</a>
            <a href="#">sobre</a>
        </div>
    </header>

    <main id="mainHomePage">

        <h2>cadastro de produtos</h2>

        <div class="input-container">
            <div class="input-box">
                <label for="nomeProduto">Nome do produto:</label>
                <input type="text" name="nomeProduto" id="nomeProduto" placeholder="Nome do produto..." required>
            </div>
             <div class="input-box">
                <label for="categoria">Categoria do produto:</label>
                <select name="cateforia" id="categoria">
                    <option value="escritorio">Materias de escritório</option>
                    <option value="ti">Equipamentos de TI</option>
                    <option value="eletricos">Materias elétricos</option>
                    <option value="limpeza&manutencao">Limpeza e manutenção</option>
                    <option value="producao">Materias de produção</option>
                    <option value="geral">Geral</option>
                </select>
            </div>
             <div class="input-box">
                <label for="quantidadeInicial">Quantidade inical:</label>
                <input type="number" name="quantidadeInicial" id="quantidadeInicial" placeholder="Quantidade inicial...">
            </div>
             <div class="input-box">
                <label for="quantidadeMinima">Quantidade mínima:</label>
                <input type="number" name="quantidadeMinima" id="quantidadeMinima" placeholder="Quantidade minima...">
            </div>
             <div class="input-box">
                <label for="localizacao">Localização:</label>
                <select name="localizacao" id="localizacao">
                    <option value="prateleiraUm">Prateleira 1</option>
                    <option value="prateleiraDois">Prateleria 2</option>
                    <option value="prateleiraTres">Prateleira 3</option>
                    <option value="prateleiraQuatro">Prateleira 4</option>
                    <option value="prateleiraCinco">Prateleira 5</option>
                </select>
            </div>
             <div class="input-box">
                <label for="fornecedor">Fornecedor:</label>
                <input type="text" name="fornecedor" id="fornecedor" placeholder="Nome do fornecedor...">
            </div>
             <div class="input-box">
                <label for="dataEntrada">Data de entrada:</label>
                <input type="date" name="dataEntrada" id="dataEntrada" placeholder="Nome do produto...">
            </div>
            <div class="buttons-container">
                <button id="adicionar">Adicionar</button>
                <button id="limpar">Limpar</b>
            </div>
        </div>
    </main>
    
    <script type="module" src="./script/homePage.js"></script>
</body>
</html>
