<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Warehouse</title>
    <link rel="stylesheet" href="./styles/shared.css">
    <link rel="stylesheet" href="./styles/estoquePage.css">
</head>
<body>

     <div class="jsMessageBoxTwo messageBoxTwo hiden">
        <div class="jsMessageContainerTwo messageContainerTwo">
            <span class="jsMessageTwo messageTwo">
                Product successfully added!
            </span>
        </div>
    </div>

    <div class="jsMessageBox messageBox hiden">
        <div class="messageContainer">
            <img class="jsCloseError" id="closeError" src="./assets/x.svg" alt="">
            <span class="jsMessage message"></span>
            <div class="jsMessageButtons messageButtons">
                <button class="jsConfirmarBtt" id="simBtt">yes</button>
                <button class="jsNegarBtt" id="naoBtt">no</button>
            </div>
        </div>
    </div>

    <header id="header">
        
        <a class="title" href="./homePage.html"><h1>warehouse</h1></a>

        <input type="checkbox" id="check">
        <label for="check" class="icons">
            <img src="./assets/menu-closer.svg" alt="menu-icon" id="menuIcon">
            <img src="./assets/x.svg" alt="close-icon" id="xIcon">
        </label>

        <div class="header-links">
            <a href="./estoquePage.html">Stock</a>
            <a href="./historicoPage.html">History</a>
            <a href="./graficoPage.html">Charts</a>
        </div>
    </header>

    <main id="mainEstoquePage">

        <div class="main-header">
         <div class="search-container js-search-container">
            <div class="search-box">
                <input class="search-input js-search-input" type="text" placeholder="Search here...">
                <img class="search-icon icon js-search-icon" src="./assets/search-icon.svg" alt="search-icon">
            </div>
            <div class="filter-box js-filter-box">
                <input type="checkbox" id="check-filter">
                <label for="check-filter" class="filtrarMain">
                    <span>Filter</span>
                    <img class="filter-icon icon" src="./assets/filter-icon.svg" alt="filter-icon">
                </label>
            </div> 
            <div class="filtar-categoria js-filtrar-categoria hiden">
                <label for="">Category</label>
               <select class="jsCategoria" name="cateforia" id="categoria">
                    <option value="escritorio">Office Supplies</option>
                    <option value="TI">IT Equipment</option>
                    <option value="eletrico">Electrical Materials</option>
                    <option value="Limpeza">Cleaning and Maintenance</option>
                    <option value="producao">Production Materials</option>
                    <option value="geral">General</option>
               </select>
               <button class="jsFiltrarBtn" id="filtrarBtn">Filter</button>
            </div> 
        </div>
        </div>

        <div class="jsProdutosContainer produtos-container-grid">

           
        </div>
    </main>
    
    <script type="module" src="./script/estoquePage.js"></script>
</body>
</html>
